<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoboCoins — прогресс награды</title>
  <style>
    :root { color-scheme: light; --blue:#1769ff; --bg:#f3f6fb; --text:#172033; --muted:#637089; --line:#e1e7f0; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:32px 16px; background:radial-gradient(circle at 15% 0,#1769ff12,transparent 32%),var(--bg); color:var(--text); font:16px/1.5 system-ui,sans-serif; }
    main { width:min(100%,620px); margin:auto; }
    h1 { margin:0 0 8px; font-size:clamp(27px,5vw,38px); letter-spacing:-.8px; }
    h2 { margin:0 0 14px; font-size:19px; }
    p { color:var(--muted); }
    .panel { margin-top:16px; padding:22px; border:1px solid var(--line); border-radius:18px; background:white; box-shadow:0 12px 34px #243b5a0b; }
    label { display:block; margin:12px 0 6px; font-weight:700; }
    input,button { width:100%; min-height:44px; padding:9px 12px; border:1px solid #ccd5e2; border-radius:10px; font:inherit; }
    button { margin-top:14px; border:0; background:var(--blue); color:white; font-weight:750; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .row { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:end; }
    .row button { min-width:120px; }
    .reward { margin-top:20px; padding:18px; border-radius:14px; background:#f7f9fc; }
    .reward[hidden] { display:none; }
    .reward-name { margin:0; font-size:21px; font-weight:800; }
    .numbers { display:flex; justify-content:space-between; gap:12px; margin:10px 0; color:var(--muted); }
    progress { display:block; width:100%; height:18px; accent-color:var(--blue); }
    .status { margin:12px 0 0; color:var(--muted); overflow-wrap:anywhere; }
    .status:empty { display:none; }
    .status.error { color:#b42318; }
    .hint { margin-bottom:0; font-size:14px; }
    @media(max-width:520px) { body { padding:20px 12px; } .panel { padding:18px; } .row { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Прогресс до награды</h1>
      <p>Например, при балансе 5 монет и награде за 10 монет прогресс составит 50%.</p>
    </header>

    <section class="panel" aria-labelledby="demo-title">
      <h2 id="demo-title">Пример — попробуйте сами</h2>
      <label for="demo-balance">Баланс, монет</label>
      <input id="demo-balance" type="number" min="0" value="5">
      <label for="demo-price">Стоимость награды, монет</label>
      <input id="demo-price" type="number" min="1" value="10">
      <div class="reward">
        <p class="reward-name">Подарочная награда 🎁</p>
        <div class="numbers"><span id="demo-percent">50%</span><span id="demo-remaining">Осталось 5 монет</span></div>
        <progress id="demo-progress" max="100" value="50">50%</progress>
      </div>
    </section>

    <section class="panel" aria-labelledby="live-title">
      <h2 id="live-title">Посмотреть данные ученика</h2>
      <form id="login-form">
        <label for="access-code">Код доступа</label>
        <div class="row"><input id="access-code" autocomplete="one-time-code" required><button id="login-button">Войти</button></div>
      </form>
      <p id="identity" class="hint"></p>
      <label for="student-id">ID ученика</label>
      <div class="row"><input id="student-id" type="number" min="1" placeholder="Например, 12"><button id="load-button" type="button">Загрузить</button></div>
      <div id="live-result" class="reward" hidden>
        <p id="live-reward" class="reward-name"></p>
        <div class="numbers"><span id="live-percent"></span><span id="live-remaining"></span></div>
        <progress id="live-progress" max="100" value="0"></progress>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p class="hint">Для загрузки нужен вход. У ученика ID подставится автоматически. Для учителя укажите ID ученика.</p>
    </section>
  </main>
  <script>
    const local = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
    const apiBase = local ? (location.port === '8000' ? '' : `${location.protocol}//${location.hostname}:8000`) : '/api';
    const $ = (id) => document.getElementById(id);
    let currentUser = null;

    function renderDemo() {
      const balance = Math.max(0, Number($('demo-balance').value) || 0);
      const price = Math.max(1, Number($('demo-price').value) || 1);
      const percent = Math.min(100, Math.round(balance / price * 100));
      $('demo-percent').textContent = `${percent}%`;
      $('demo-remaining').textContent = balance >= price ? 'Награда доступна!' : `Осталось ${price - balance} монет`;
      $('demo-progress').value = percent;
    }
    $('demo-balance').addEventListener('input', renderDemo);
    $('demo-price').addEventListener('input', renderDemo);

    async function request(path, options = {}) {
      const response = await fetch(`${apiBase}${path}`, { credentials:'include', ...options });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
      return body;
    }
    function setStatus(message, error = false) {
      $('status').textContent = message;
      $('status').classList.toggle('error', error);
    }
    function setUser(user) {
      currentUser = user;
      $('identity').textContent = user ? `Вошли: ${user.name} · ${user.role === 'teacher' ? 'учитель' : 'ученик'} (ID ${user.id})` : 'Войдите по коду доступа, чтобы загрузить прогресс.';
      if (user?.role === 'student') $('student-id').value = user.id;
    }
    async function loadProgress() {
      if (!currentUser) throw new Error('Сначала войдите по коду доступа.');
      const id = Number($('student-id').value);
      if (!Number.isInteger(id) || id < 1) throw new Error('Укажите корректный ID ученика.');
      setStatus('Загружаю баланс и награду…');
      const data = await request(`/student/${id}/reward-progress`);
      if (!data.reward) {
        $('live-result').hidden = true;
        setStatus(`Баланс: ${data.balance} монет. Пока нет награды дороже этого баланса.`);
        return;
      }
      $('live-result').hidden = false;
      $('live-reward').textContent = data.reward.name;
      $('live-percent').textContent = `${data.progress_percent}% · ${data.balance} из ${data.reward.price} монет`;
      $('live-remaining').textContent = `Осталось ${data.coins_remaining} монет`;
      $('live-progress').value = data.progress_percent;
      setStatus('Прогресс обновлён.');
    }
    $('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      $('login-button').disabled = true;
      setStatus('Выполняется вход…');
      try {
        await request('/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code:$('access-code').value.trim()}) });
        setUser(await request('/auth/me'));
        setStatus('Вход выполнен.');
        if ($('student-id').value) await loadProgress();
      } catch (error) { setStatus(error.message, true); }
      finally { $('login-button').disabled = false; }
    });
    $('load-button').addEventListener('click', async () => {
      try { await loadProgress(); } catch (error) { setStatus(error.message, true); }
    });
    request('/auth/me').then(setUser).catch(() => setUser(null));
    renderDemo();
  </script>
</body>
</html>
