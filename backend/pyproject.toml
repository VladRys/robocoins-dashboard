[project]
name = "robocoins-dashboard"
version = "0.1.0"
description = "🎓 Open-source gamification platform for education with virtual currency, rewards, student profiles and teacher management."
authors = [
    {name = "VladRys",email = "rysichvlad0910@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "alembic (>=1.14,<2.0)",
    "sqlalchemy[asyncio] (>=2.1.1,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "asyncpg (>=0.31.0,<1.0.0)",
    "aiosqlite (>=0.21.0,<1.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
