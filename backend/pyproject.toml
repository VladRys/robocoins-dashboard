[project]
name = "robocoins-dashboard"
version = "0.1.0"
description = "🎓 Open-source gamification platform for education with virtual currency, rewards, student profiles and teacher management."
authors = [
    {name = "VladRys",email = "rysichvlad0910@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "sqlalchemy (>=2.1.1,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic (>=2.13.5,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
