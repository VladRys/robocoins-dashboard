<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoboCoins — группы учителя по курсу</title>
  <style>
    :root { color-scheme: light; --blue: #1769ff; --bg: #f3f6fb; --text: #172033; --muted: #637089; --line: #e1e7f0; --red: #b42318; --green: #067647; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 32px 18px; color: var(--text); background: radial-gradient(circle at 15% 0, #1769ff12, transparent 30%), var(--bg); font: 15px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 760px); margin: 0 auto; }
    header { margin-bottom: 24px; }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 36px); letter-spacing: -.8px; }
    h2 { margin: 0 0 14px; font-size: 19px; }
    p { margin: 0 0 16px; color: var(--muted); }
    .panel { margin-bottom: 16px; padding: 22px; border: 1px solid var(--line); border-radius: 16px; background: #fff; box-shadow: 0 10px 30px #243b5a0b; }
    label { display: block; margin: 12px 0 6px; font-weight: 700; }
    input, button { width: 100%; min-height: 44px; border-radius: 10px; font: inherit; }
    input { padding: 0 12px; border: 1px solid #ccd5e2; background: #fff; color: var(--text); }
    button { padding: 10px 14px; border: 0; background: var(--blue); color: #fff; font-weight: 750; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
    .row button { min-width: 150px; }
    .secondary { width: auto; min-height: 36px; margin-top: 10px; padding: 6px 12px; border: 1px solid var(--line); background: #fff; color: var(--text); }
    .identity, .status { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #f3f6fb; overflow-wrap: anywhere; }
    .identity:empty, .status:empty { display: none; }
    .status { color: var(--muted); }
    .status.error { background: #fff1f0; color: var(--red); }
    .status.success { background: #ecfdf3; color: var(--green); }
    .groups { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .groups li { padding: 13px; border: 1px solid var(--line); border-radius: 10px; }
    .groups strong { display: block; }
    .muted { color: var(--muted); font-size: 13px; }
    .empty { padding: 16px; border: 1px dashed #ccd5e2; border-radius: 10px; color: var(--muted); text-align: center; }
    @media (max-width: 600px) { body { padding: 20px 12px; } .panel { padding: 18px; } .row { grid-template-columns: 1fr; } .row button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Группы учителя по курсу</h1>
      <p>Войдите как учитель, укажите ID курса и запросите назначенные вам группы.</p>
    </header>

    <section class="panel">
      <h2>Сессия учителя</h2>
      <form id="login-form">
        <label for="access-code">Код доступа</label>
        <div class="row">
          <input id="access-code" autocomplete="one-time-code" required>
          <button id="login-button" type="submit">Войти</button>
        </div>
      </form>
      <div id="identity" class="identity" aria-live="polite"></div>
      <button id="logout-button" class="secondary" type="button" hidden>Выйти</button>
      <div id="session-status" class="status" role="status" aria-live="polite"></div>
    </section>

    <section class="panel">
      <h2>Запрос групп</h2>
      <form id="groups-form">
        <label for="course-id">ID курса</label>
        <div class="row">
          <input id="course-id" type="number" min="1" step="1" placeholder="Например, 3" required>
          <button id="load-button" type="submit">Загрузить группы</button>
        </div>
      </form>
      <div id="groups-status" class="status" role="status" aria-live="polite"></div>
      <ul id="groups" class="groups" aria-live="polite"></ul>
      <div id="groups-empty" class="empty">Войдите как учитель и укажите ID курса.</div>
    </section>
  </main>

  <script>
    const isLocal = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
    const apiBase = isLocal
      ? (location.port === '8000' ? '' : `${location.protocol}//${location.hostname}:8000`)
      : '/api';
    const $ = (id) => document.getElementById(id);
    let currentUser = null;

    async function request(path, options = {}) {
      const response = await fetch(`${apiBase}${path}`, { credentials: 'include', ...options });
      const text = await response.text();
      let body = null;
      if (text) {
        try { body = JSON.parse(text); } catch { body = text; }
      }
      if (!response.ok) {
        const detail = body && typeof body === 'object' && 'detail' in body
          ? body.detail : typeof body === 'string' ? body : response.statusText;
        throw new Error(`HTTP ${response.status}: ${detail}`);
      }
      return body;
    }

    function setStatus(id, message, kind = '') {
      $(id).textContent = message;
      $(id).className = `status${kind ? ` ${kind}` : ''}`;
    }

    function setUser(user) {
      currentUser = user;
      $('identity').textContent = user ? `${user.name} · ${user.role} · ID ${user.id}` : '';
      $('logout-button').hidden = !user;
    }

    function renderGroups(groups) {
      const list = $('groups');
      list.replaceChildren();
      $('groups-empty').hidden = groups.length > 0;
      if (!groups.length) {
        $('groups-empty').textContent = 'Для этого курса назначенных вам групп нет.';
        return;
      }
      for (const group of groups) {
        const item = document.createElement('li');
        const name = document.createElement('strong');
        name.textContent = group.name;
        const details = document.createElement('span');
        details.className = 'muted';
        details.textContent = `ID группы ${group.id} · учеников: ${group.students_count} · преподаватели: ${(group.teacher_ids || []).join(', ')}`;
        item.append(name, details);
        list.append(item);
      }
    }

    $('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      $('login-button').disabled = true;
      setStatus('session-status', 'Выполняется вход…');
      try {
        await request('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: $('access-code').value.trim() })
        });
        const user = await request('/auth/me');
        if (user.role !== 'teacher') throw new Error('Для этого эндпоинта нужен аккаунт учителя.');
        setUser(user);
        setStatus('session-status', 'Вход выполнен.', 'success');
      } catch (error) {
        setUser(null);
        setStatus('session-status', error.message, 'error');
      } finally {
        $('login-button').disabled = false;
      }
    });

    $('logout-button').addEventListener('click', async () => {
      try {
        await request('/auth/logout', { method: 'POST' });
        setUser(null);
        setStatus('session-status', 'Вы вышли из аккаунта.', 'success');
      } catch (error) {
        setStatus('session-status', error.message, 'error');
      }
    });

    $('groups-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const courseId = Number($('course-id').value);
      if (!Number.isInteger(courseId) || courseId < 1) {
        setStatus('groups-status', 'Укажите корректный ID курса.', 'error');
        return;
      }
      $('load-button').disabled = true;
      setStatus('groups-status', 'Загружаем группы…');
      try {
        const groups = await request(`/teacher/course/${courseId}/groups`);
        if (!Array.isArray(groups)) throw new Error('API вернул неожиданный формат ответа.');
        renderGroups(groups);
        setStatus('groups-status', `Получено групп: ${groups.length}.`, 'success');
      } catch (error) {
        renderGroups([]);
        $('groups-empty').textContent = 'Не удалось загрузить группы.';
        setStatus('groups-status', error.message, 'error');
      } finally {
        $('load-button').disabled = false;
      }
    });

    request('/auth/me').then((user) => {
      if (user.role === 'teacher') {
        setUser(user);
        setStatus('session-status', 'Сессия уже активна.', 'success');
      }
    }).catch(() => {});
  </script>
</body>
</html>
