<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoboCoins API Login Test</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 16px/1.5 system-ui, sans-serif; color: #172033; background: #f3f6fb; }
    main { width: min(100%, 420px); padding: 32px; border: 1px solid #e1e7f0; border-radius: 18px; background: white; box-shadow: 0 18px 50px #243b5a12; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 24px; color: #637089; }
    .backend { margin: -10px 0 20px; font-size: 14px; }
    .backend a { color: #1769ff; overflow-wrap: anywhere; }
    label { display: block; margin-bottom: 8px; font-weight: 650; }
    input, button { width: 100%; min-height: 48px; border-radius: 10px; font: inherit; }
    input { padding: 0 13px; border: 1px solid #ccd5e2; }
    input:focus { outline: 3px solid #1769ff25; border-color: #1769ff; }
    button { margin-top: 14px; border: 0; background: #1769ff; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    pre { overflow-wrap: anywhere; white-space: pre-wrap; margin: 18px 0 0; padding: 13px; border-radius: 10px; background: #f3f6fb; color: #344054; }
    pre:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>API login test</h1>
    <p>Enter a student's access code to test <code>POST /auth/login</code>.</p>
    <div class="backend">Backend: <a id="backend-link" target="_blank" rel="noreferrer"></a></div>
    <form id="login-form">
      <label for="code">Access code</label>
      <input id="code" name="code" autocomplete="one-time-code" required>
      <button id="submit" type="submit">Log in</button>
    </form>
    <pre id="result" role="status" aria-live="polite"></pre>
  </main>
  <script>
    const isLocal = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
    const backendUrl = isLocal
      ? 'http://localhost:8000'
      : 'https://robocoins-dashboard.vercel.app';
    const backendLink = document.querySelector('#backend-link');
    backendLink.href = backendUrl;
    backendLink.textContent = backendUrl;
    const form = document.querySelector('#login-form');
    const button = document.querySelector('#submit');
    const result = document.querySelector('#result');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      result.textContent = 'Sending request…';
      try {
        const response = await fetch(`${backendUrl}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: form.elements.code.value.trim() }),
          mode: 'cors'
        });
        const body = await response.json().catch(() => ({}));
        result.textContent = JSON.stringify({ status: response.status, ...body }, null, 2);
      } catch (error) {
        result.textContent = `Request failed: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
